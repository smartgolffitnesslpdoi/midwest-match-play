<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midwest Match Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#16231C; --pencil:#5B6560; --rule:#D3DAD5;
  --fairway:#1F4A33; --fairway-ink:#FFFFFF; --flag:#E2B12E; --up:#2E7D4F; --down:#B4472F;
  --shadow:0 1px 0 rgba(22,35,28,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A14; --card:#17251D; --ink:#E7EEE9; --pencil:#9AA8A0; --rule:#2B3A31;
    --fairway:#3E8A5E; --fairway-ink:#FFFFFF; --flag:#E9BE45; --up:#6CC08E; --down:#E58668;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A14; --card:#17251D; --ink:#E7EEE9; --pencil:#9AA8A0; --rule:#2B3A31;
  --fairway:#3E8A5E; --fairway-ink:#FFFFFF; --flag:#E9BE45; --up:#6CC08E; --down:#E58668;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 96px}
header h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--pencil);font-size:14px}
.states{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.states button{flex:1 1 auto;font:inherit;font-size:13.5px;font-weight:600;padding:9px 12px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--pencil);cursor:pointer}
.states button[aria-pressed="true"]{background:var(--fairway);border-color:var(--fairway);color:var(--fairway-ink)}
.states button:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.meter{margin:18px 0 22px}
.meter .bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter .fill{height:100%;background:var(--fairway);width:0;transition:width .35s ease}
.meter .nums{display:flex;justify-content:space-between;font-size:13px;color:var(--pencil);margin-top:6px}

.prompt{font-size:15px;color:var(--pencil);margin:0 0 10px}
.match{display:grid;gap:10px}
.course{all:unset;display:block;cursor:pointer;background:var(--card);border:1.5px solid var(--rule);border-radius:14px;
  padding:20px 18px 18px;position:relative;box-shadow:var(--shadow);transition:border-color .15s, transform .12s}
.course:hover{border-color:var(--fairway)}
.course:active{transform:scale(.985)}
.course:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.course .name{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:24px;line-height:1.15;display:block;padding-right:28px}
.course .meta{display:block;margin-top:6px;font-size:13px;color:var(--pencil)}
.course .tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;color:var(--fairway);
  border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.course.challenger .tag{color:var(--ink);background:var(--flag);border-color:var(--flag)}
.course.picked{border-color:var(--fairway);background:color-mix(in srgb,var(--fairway) 10%,var(--card))}
.vs{text-align:center;font-family:"Newsreader",Georgia,serif;font-style:italic;color:var(--pencil);font-size:15px;margin:-2px 0}
.side{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:12px 14px;cursor:pointer;border:1.5px solid var(--rule);
  background:transparent;color:var(--ink);flex:1 1 auto;min-height:46px}
.btn:hover{border-color:var(--pencil)}
.btn:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.btn.primary{background:var(--fairway);border-color:var(--fairway);color:var(--fairway-ink)}
.btn.skip{border-style:dashed}
.btn.small{flex:0 0 auto;padding:6px 10px;min-height:0;font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--pencil);margin-top:12px;text-align:center}
@media (hover:none){.hint{display:none}}
.undo{background:none;border:none;color:var(--pencil);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px 0;margin-top:6px}
.undo:disabled{opacity:.4;cursor:default}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tabs button{font:inherit;font-size:14px;font-weight:600;background:none;border:none;color:var(--pencil);padding:16px 8px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fairway);box-shadow:inset 0 3px 0 var(--fairway)}

.list{list-style:none;margin:0;padding:0;counter-reset:none}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--rule)}
.row .pos{font-family:"Newsreader",Georgia,serif;font-size:22px;font-weight:600;color:var(--fairway);text-align:right}
.row:first-child .pos{color:var(--ink)}
.row .nm{font-weight:600;font-size:15px;line-height:1.25}
.row .sub{font-size:12.5px;color:var(--pencil)}
.delta{font-size:12.5px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.eq{color:var(--pencil)}
.row .acts{display:flex;gap:6px;align-items:center}
h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:22px;margin:26px 0 8px}
.empty{color:var(--pencil);padding:24px 0}
.done{background:var(--fairway);color:var(--fairway-ink);border-radius:14px;padding:20px 18px;margin-bottom:18px}
.done h2{margin:0 0 6px;color:inherit}
.done p{margin:0 0 14px;opacity:.9}
.done .btn{border-color:rgba(255,255,255,.5);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.chip button{font:inherit;font-size:12px;border:none;background:var(--paper);color:var(--fairway);border-radius:999px;padding:3px 8px;cursor:pointer;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
textarea.export{width:100%;min-height:180px;font:13px/1.5 "Public Sans",system-ui,sans-serif;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Midwest Match Play</h1>
    <p>Pick the better course, one match at a time. Your ranking builds as you go and saves in this browser.</p>
    <div class="states" id="statePick" role="group" aria-label="State">
      <button data-st="il">Illinois</button><button data-st="in">Indiana</button><button data-st="mi">Michigan</button><button data-st="oh">Ohio</button><button data-st="wi">Wisconsin</button>
    </div>
  </header>
  <div class="meter" aria-live="polite">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="nums"><span id="progressText"></span><span id="matchText"></span></div>
  </div>
  <main id="playView"></main>
  <main id="rankView" hidden></main>
</div>
<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" id="tabPlay" aria-selected="true">Head to head</button>
    <button role="tab" id="tabRank" aria-selected="false">My ranking</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
// Top 100 Golf Courses state leaderboards (top100golfcourses.com), ranked positions only
const STATE_NAMES={il:"Illinois",in:"Indiana",mi:"Michigan",oh:"Ohio",wi:"Wisconsin"};
const RAW={"il": ["Chicago Golf Club", "Shoreacres", "Old Elm Club", "Medinah Country Club (No.3)", "Beverly Country Club", "Skokie Country Club", "Butler National Golf Club", "Conway Farms", "Olympia Fields Country Club (North)", "Black Sheep Golf Club (1st & 2nd)", "Flossmoor Golf Club", "Medinah Country Club (No.1)", "Olympia Fields (South)", "Bob O'Link Golf Club", "North Shore Country Club", "Cog Hill Golf & Country Club (No.4)", "Knollwood Club", "Onwentsia Club", "Canyata Golf Club", "Glen View Club", "Rich Harvest Farms", "Exmoor", "TPC Deere Run", "Bull Valley", "Merit Club", "Medinah (No.2)", "Midlothian Country Club", "Evanston", "Butterfield (White & Blue)", "The Club at Wynstone", "Chicago Highlands", "Highlands of Elgin", "Ivanhoe (Prairie & Forest)", "Kemper Lakes", "St Clair Country Club", "Ruth Lake", "ThunderHawk", "Crystal Tree", "The Glen Club", "Ravisloe Country Club", "Kankakee Elks", "Shepherd's Crook", "Annbriar", "Gateway National Golf Links", "The Preserve at Oak Meadows", "Barrington Hills", "Briarwood Country Club", "Westmoreland", "Cantigny (Woodside & Lakeside)", "Hinsdale", "Indian Hill Club", "Prairie Landing", "Eagle Ridge (The General)", "Sunset Ridge", "Oak Park", "Stonewall Orchard", "WeaverRidge", "Mount Prospect", "Ruffled Feathers", "Idlewild", "Mistwood", "Pine Meadow", "Harborside International (Starboard)", "Bowes Creek", "Blackstone Golf Club", "Northmoor (Blue & White)", "La Grange", "Stonebridge Country Club", "Harborside International (Port)", "Sunset Hills"], "in": ["Victoria National Golf Club", "Crooked Stick Golf Club", "French Lick Resort (Donald Ross)", "French Lick Resort (Pete Dye)", "Culver Academies Golf Course", "Pfau Course at Indiana University", "Warren Golf Course", "The Fort", "Broadmoor Country Club", "Country Club of Indianapolis", "Birck Boilermaker (Kampen)", "Harrison Hills", "Brickyard Crossing", "Prairie View", "The Trophy Club", "Sycamore Hills", "Elcona", "Rock Hollow", "Sultan's Run", "South Bend", "Sagamore Golf Club", "Woodland", "Bridgewater (Championship)", "Otter Creek (North & West)", "Blackthorn", "Chariot Run", "Sand Creek (Creek & Lake)", "Covered Bridge", "Battle Ground", "Purgatory", "Chatham Hills", "Birck Boilermaker (Ackerman-Allen)", "Bear Slide", "Belterra", "Meridian Hills", "Swan Lake (Black)", "Harbor Links at Sagamore", "The Links at Heartland Crossing", "The Hawthorns", "Tippecanoe"], "mi": ["Crystal Downs Country Club", "Oakland Hills Country Club (South)", "Kingsley Club", "Dunes Club", "Meadowbrook Country Club", "Franklin Hills Country Club", "Forest Dunes (The Loop - Black)", "Forest Dunes (Weiskopf)", "Marquette Golf Club (Greywalls)", "Indianwood (Old)", "Barton Hills", "Arcadia Bluffs (Bluffs)", "Lost Dunes Golf Club", "Orchard Lake", "Bloomfield Hills Country Club", "Forest Dunes (The Loop - Red)", "Point O' Woods", "True North Golf Club", "Arcadia Bluffs (South)", "Country Club of Detroit", "Gull Lake View (Stoatin Brae)", "Battle Creek", "Oakland Hills (North)", "Belvedere Golf Club", "University of Michigan Golf Course", "Birmingham Country Club", "Wuskowhan Players", "Forest Lake", "Muskegon", "Boyne Highlands (Heather)", "Eagle Eye", "Pilgrim's Run Golf Club", "Treetops (Premier)", "Radrick Farms Golf Course", "LochenHeath Golf Club", "Bay Harbor (Links & Quarry)", "Grosse Ile", "Tullymore", "American Dunes Golf Club", "Warwick Hills", "Detroit (South)", "Detroit (North)", "Harbor Shores Resort", "Indianwood (New)", "Wawashkamo", "Red Run", "Dunmaglas", "Plum Hollow", "Flint", "Oakland University Golf & Learning Center", "Black Lake", "Treetops (Masterpiece)", "Boyne Highlands (Arthur Hills)", "The Mines", "Western", "Shanty Creek (The Legend)", "Treetops (Signature)", "Boyne Highlands (Donald Ross Memorial)", "TimberStone at Pine Mountain", "Sweetgrass", "Shanty Creek (Cedar River)", "Diamond Springs", "Lakewood Shores (The Gailes)", "Country Club of Lansing", "Lochmoor", "Boyne Mountain (Alpine)", "Grand Traverse (The Bear)", "Sage Run", "Angels Crossing", "The Orchards", "Shepherd's Hollow (10-27)", "Coyote Preserve"], "oh": ["Camargo Club", "Inverness Club", "The Golf Club", "Scioto Country Club", "Muirfield Village Golf Club", "Moraine Country Club", "Brookside Country Club", "The Country Club", "The Kirtland Country Club", "Canterbury Golf Club", "Pepper Pike Club", "Double Eagle Club", "NCR (South)", "Springfield", "Firestone Country Club (South)", "Fowler's Mill (Lake & River)", "Hyde Park", "Firestone Country Club (North)", "Mayfield Sand Ridge (Mayfield)", "Ohio State University (Scarlet)", "Elyria", "Coldstream Country Club", "Mayfield Sand Ridge (Sand Ridge)", "The Virtues", "TPC River's Bend", "Manakiki Golf Course", "Westwood Country Club", "Kenwood (Kendale)", "Sleepy Hollow Golf Course", "Westbrook", "Portage", "Sylvania", "Youngstown", "Stonelick Hills", "Kenwood (Kenview)", "Maketewah", "Columbus Country Club (Championship)", "Chagrin Valley", "Shaker Heights", "Brookside Golf & Country Club", "Avalon Lakes", "EagleSticks", "Wedgewood Golf & Country Club", "Barrington", "Pinnacle Golf Club", "NCR (North)", "New Albany (West & North)", "Country Club of the North", "Lakewood Country Club", "Apple Valley", "Piqua", "Little Mountain", "Ivy Hills", "Quarry Golf Club", "The Sharon Golf Club", "Congress Lake", "Tartan Fields", "Denison Golf Club", "Firestone Country Club (Fazio)", "Mohawk", "Shaker Run (Woodlands & Lakeside)", "Boulder Creek", "Sugar Bush", "Yankee Trace (Heritage & Legend)", "Kennsington", "Country Club at Muirfield Village", "Coppertop", "Miami Valley", "Clovernook", "Black Diamond", "Stone Ridge", "Ohio State University (Gray)", "Zanesville", "Catawba Island"], "wi": ["The Lido Golf Club (Sand Valley)", "Whistling Straits (Straits)", "Milwaukee Country Club", "Lawsonia (Links)", "Sand Valley (Sand Valley)", "Sand Valley (Sedge Valley)", "Sand Valley (Mammoth Dunes)", "Erin Hills", "Blue Mound Golf & Country Club", "Blackwolf Run (River)", "Whistling Straits (Irish)", "Pine Hills Country Club", "The Club at Lac La Belle", "West Bend", "SentryWorld", "Blackwolf Run (Meadow Valleys)", "University Ridge", "The Bull at Pinehurst Farms", "Troy Burne", "Green Bay", "Oneida", "Wild Rock at the Wilderness", "Strawberry Creek", "Minocqua", "North Hills", "Grand Geneva (Brute)", "Horseshoe Bay", "Ozaukee", "Geneva National (Arnold Palmer)", "The Bog", "Lawsonia (Woodlands)", "Westmoor", "La Crosse", "Hawks View (Como Crossings)", "Geneva National (Gary Player)", "Kenosha Country Club", "Big Fish", "Tuckaway", "Bishops Bay", "Trappers Turn (Lake & Canyon)"]};
const slug=s=>s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const DATA={};for(const k in RAW)DATA[k]=RAW[k].map((name,i)=>({id:slug(name),name,rank:i+1}));
let CUR=(()=>{try{const c=localStorage.getItem("mw-cur");if(c&&DATA[c])return c}catch(e){}return "il"})();
let COURSES,BY_ID,TOTAL,LS_KEY;
function bindState(k){CUR=k;COURSES=DATA[k];BY_ID=Object.fromEntries(COURSES.map(c=>[c.id,c]));TOTAL=COURSES.length;LS_KEY="mw-match-play-"+k}
bindState(CUR);

function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {queue:shuffled(COURSES.map(c=>c.id)),ranked:[],notPlayed:[],current:null,matches:0,updatedAt:Date.now()}}

let S = load() || fresh();
let history = [];
let tab = "play";

function load(){try{const r=localStorage.getItem(LS_KEY);if(r){const s=JSON.parse(r);if(valid(s))return s}}catch(e){}return null}
function valid(s){return s&&Array.isArray(s.queue)&&Array.isArray(s.ranked)&&Array.isArray(s.notPlayed)}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
}
function snapshot(){history.push(JSON.stringify(S));if(history.length>60)history.shift()}
function undo(){if(!history.length)return;S=JSON.parse(history.pop());save();render();toast("Undone")}

// Pull the next challenger; set binary-search bounds
function advance(){
  if(S.current) return;
  // add any new course ids (future-proofing) not yet seen
  if(!S.queue.length) return;
  const id=S.queue.shift();
  S.current={id,lo:0,hi:S.ranked.length};
}
function opponent(){const c=S.current;if(!c||!S.ranked.length)return null;const mid=Math.floor((c.lo+c.hi)/2);return {mid,id:S.ranked[mid]}}
function settle(pos){S.ranked.splice(pos,0,S.current.id);S.current=null;advance()}

function pick(challengerWins){
  const c=S.current;if(!c)return;snapshot();
  const o=opponent();S.matches++;
  if(challengerWins) c.hi=o.mid; else c.lo=o.mid+1;
  if(c.lo>=c.hi) settle(c.lo);
  save();render();
}
function tie(){const c=S.current;if(!c)return;snapshot();const o=opponent();S.matches++;settle(o.mid+1);save();render();toast("Placed right below "+BY_ID[o.id].name)}
function notPlayed(){const c=S.current;if(!c)return;snapshot();S.notPlayed.push(c.id);S.current=null;advance();save();render()}
function firstPlayed(){const c=S.current;if(!c)return;snapshot();settle(0);save();render()}
function rerank(id){
  snapshot();
  S.ranked=S.ranked.filter(x=>x!==id);
  if(S.current){S.queue.unshift(S.current.id)}
  S.current={id,lo:0,hi:S.ranked.length};
  if(!S.ranked.length){} // will ask played/not
  save();switchTab("play");render();
}
function restore(id){snapshot();S.notPlayed=S.notPlayed.filter(x=>x!==id);
  if(S.current){S.queue.unshift(id)}else{S.current={id,lo:0,hi:S.ranked.length}}
  save();switchTab("play");render()}
function switchState(k){
  if(k===CUR)return;
  bindState(k);try{localStorage.setItem("mw-cur",k)}catch(e){}
  S=load()||fresh();history=[];advance();
  document.querySelectorAll("#statePick button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===k));
  render();window.scrollTo(0,0);
}
function resetAll(){if(!confirm(`Start over on ${STATE_NAMES[CUR]}? This clears that ranking.`))return;snapshot();S=fresh();advance();save();render()}

const resolved=()=>S.ranked.length+S.notPlayed.length;
const isDone=()=>!S.current&&!S.queue.length;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function card(c,role,label){
  return `<button class="course ${role}" data-role="${role}">
    <span class="tag">${label}</span>
    <span class="name">${esc(c.name)}</span>
    <span class="meta">No. ${c.rank} in ${STATE_NAMES[CUR]} on Top 100</span>
  </button>`;
}

function renderPlay(){
  const v=document.getElementById("playView");
  if(isDone()){
    v.innerHTML=`<div class="done"><h2>Every ${STATE_NAMES[CUR]} course is sorted</h2>
      <p>You ranked ${S.ranked.length} courses you've played${S.notPlayed.length?` and set aside ${S.notPlayed.length} you haven't`:""}, in ${S.matches} matches.</p>
      <button class="btn" id="seeRank">See my ranking</button></div>`;
    v.querySelector("#seeRank").onclick=()=>switchTab("rank");
    return;
  }
  const ch=BY_ID[S.current.id];
  const o=opponent();
  if(!o){
    v.innerHTML=`<p class="prompt">Let's start with your first course. Have you played it?</p>
      <div class="match">${card(ch,"challenger","New")}</div>
      <div class="side">
        <button class="btn primary" id="yes">I've played it</button>
        <button class="btn skip" id="no">Haven't played</button>
      </div>
      ${undoBtn()}`;
    v.querySelector("#yes").onclick=firstPlayed;
    v.querySelector("#no").onclick=notPlayed;
    v.querySelector(".course").onclick=firstPlayed;
  } else {
    const op=BY_ID[o.id];
    const yourPos=o.mid+1;
    v.innerHTML=`<p class="prompt">Which course do you prefer?</p>
      <div class="match">
        ${card(ch,"challenger","New")}
        <div class="vs" aria-hidden="true">or</div>
        ${card(op,"incumbent","Your No. "+yourPos)}
      </div>
      <div class="side">
        <button class="btn" id="tie">Too close to call</button>
        <button class="btn skip" id="np">Haven't played ${esc(ch.name)}</button>
      </div>
      ${undoBtn()}
      <p class="hint">Keys: ← or 1 for the new course, → or 2 for your No. ${yourPos}, T for too close, N for haven't played, U to undo</p>`;
    const [a,b]=v.querySelectorAll(".course");
    a.onclick=()=>flash(a,()=>pick(true));
    b.onclick=()=>flash(b,()=>pick(false));
    v.querySelector("#tie").onclick=tie;
    v.querySelector("#np").onclick=notPlayed;
  }
  const u=v.querySelector(".undo");if(u)u.onclick=undo;
}
function undoBtn(){return `<button class="undo" ${history.length?"":"disabled"}>Undo last choice</button>`}
function flash(el,fn){el.classList.add("picked");setTimeout(fn,140)}

function deltaHtml(c,myPos,playedRankOf){
  // compare against the site's order among only the courses you've played
  const siteAmongPlayed=playedRankOf[c.id];
  const d=siteAmongPlayed-myPos;
  if(d>0) return `<span class="delta up" title="Higher than Top 100 has it among your courses">▲ ${d}</span>`;
  if(d<0) return `<span class="delta down" title="Lower than Top 100 has it among your courses">▼ ${-d}</span>`;
  return `<span class="delta eq" title="Same spot as Top 100 among your courses">=</span>`;
}

function renderRank(){
  const v=document.getElementById("rankView");
  const played=S.ranked.map(id=>BY_ID[id]);
  const siteOrder=played.slice().sort((a,b)=>a.rank-b.rank);
  const playedRankOf=Object.fromEntries(siteOrder.map((c,i)=>[c.id,i+1]));
  const done=isDone();
  let h="";
  if(!played.length){
    h+=`<p class="empty">No courses ranked yet. Play a few head-to-heads and your list will show up here.</p>`;
  } else {
    h+=`<p class="prompt" style="margin-top:4px">${done?"Final ranking":"Ranking so far"}: ${played.length} course${played.length>1?"s":""}.
      Arrows show how your order compares with Top 100's order of the same courses.</p>
      <div class="toolbar"><button class="btn small" id="copy">Copy as text</button></div>
      <ol class="list">`+played.map((c,i)=>`
      <li class="row">
        <span class="pos">${i+1}</span>
        <span><span class="nm">${esc(c.name)}</span><br><span class="sub">Top 100: No. ${c.rank} in ${STATE_NAMES[CUR]}</span></span>
        <span class="acts">${deltaHtml(c,i+1,playedRankOf)}<button class="btn small" data-rerank="${c.id}" aria-label="Re-rank ${esc(c.name)}">Re-rank</button></span>
      </li>`).join("")+`</ol>
      <div id="exportBox"></div>`;
  }
  if(S.notPlayed.length){
    h+=`<h2>Haven't played (${S.notPlayed.length})</h2>
      <div class="chips">`+S.notPlayed.map(id=>BY_ID[id]).sort((a,b)=>a.rank-b.rank).map(c=>
        `<span class="chip">${esc(c.name)}<button data-restore="${c.id}" aria-label="I've played ${esc(c.name)}">Played it</button></span>`).join("")+`</div>`;
  }
  const left=S.queue.length+(S.current?1:0);
  if(left) h+=`<p class="prompt" style="margin-top:22px">${left} course${left>1?"s":""} still to sort.</p>`;
  h+=`<div class="toolbar" style="margin-top:28px"><button class="btn small" id="reset">Start over</button></div>`;
  v.innerHTML=h;
  v.querySelectorAll("[data-rerank]").forEach(b=>b.onclick=()=>rerank(b.dataset.rerank));
  v.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>restore(b.dataset.restore));
  v.querySelector("#reset").onclick=resetAll;
  const cp=v.querySelector("#copy");
  if(cp) cp.onclick=async()=>{
    const txt=`My ${STATE_NAMES[CUR]} ranking\n`+played.map((c,i)=>`${i+1}. ${c.name} (Top 100 ${CUR.toUpperCase()} #${c.rank})`).join("\n")
      +(S.notPlayed.length?`\n\nHaven't played: ${S.notPlayed.length}`:"");
    try{await navigator.clipboard.writeText(txt);toast("Ranking copied")}
    catch(e){const box=v.querySelector("#exportBox");box.innerHTML=`<textarea class="export" readonly></textarea>`;const t=box.firstChild;t.value=txt;t.focus();t.select();toast("Select and copy the text below")}
  };
}

function render(){
  const r=resolved();
  document.getElementById("fill").style.width=(r/TOTAL*100)+"%";
  document.getElementById("progressText").textContent=`${r} of ${TOTAL} courses sorted`;
  document.getElementById("matchText").textContent=`${S.matches} matches`;
  if(tab==="play")renderPlay();else renderRank();
}
function switchTab(t){
  tab=t;
  document.getElementById("playView").hidden=t!=="play";
  document.getElementById("rankView").hidden=t!=="rank";
  document.getElementById("tabPlay").setAttribute("aria-selected",t==="play");
  document.getElementById("tabRank").setAttribute("aria-selected",t==="rank");
  render();window.scrollTo(0,0);
}
document.getElementById("tabPlay").onclick=()=>switchTab("play");
document.getElementById("tabRank").onclick=()=>switchTab("rank");

let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1600)}

document.addEventListener("keydown",e=>{
  if(tab!=="play"||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==="u"){undo();return}
  if(!S.current)return;
  if(!opponent()){ if(k==="y"||k==="1"||k==="arrowleft")firstPlayed(); else if(k==="n")notPlayed(); return }
  if(k==="arrowleft"||k==="1"){e.preventDefault();pick(true)}
  else if(k==="arrowright"||k==="2"){e.preventDefault();pick(false)}
  else if(k==="t")tie();
  else if(k==="n")notPlayed();
});

document.querySelectorAll("#statePick button").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.st===CUR);b.onclick=()=>switchState(b.dataset.st)});
advance();render();

</script>
</body>
</html>
